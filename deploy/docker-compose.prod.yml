# docker-compose.prod.yml — para deploy en producción
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    environment:
      DATABASE_URL: postgresql+psycopg://chaco:CHACO_PASSWORD@db:5432/chaco
      CORS_ORIGINS: '["https://demo.eibrapp.com.py"]'
    ports:
      - "127.0.0.1:8010:8000"  # solo localhost, el proxy reverso accede
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2

  db:
    environment:
      POSTGRES_PASSWORD: CHACO_PASSWORD
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
