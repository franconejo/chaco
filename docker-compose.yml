services:
  db:
    image: postgres:16-alpine
    container_name: chaco-db
    environment:
      POSTGRES_USER: chaco
      POSTGRES_PASSWORD: chaco
      POSTGRES_DB: chaco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaco -d chaco"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: chaco-api
    environment:
      DATABASE_URL: postgresql+psycopg://chaco:chaco@db:5432/chaco
    ports:
      - "8010:8000"
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
